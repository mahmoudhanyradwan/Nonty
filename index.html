<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
  <title id="page-title">أنا آسف يا نونتي 🤍</title>
  <meta name="description" id="meta-desc" content="رسالة اعتذار من القلب">
  <meta name="theme-color" content="#0a0a1a">
  <meta property="og:title" id="og-title" content="أنا آسف يا نونتي 🤍">
  <meta property="og:description" id="og-desc" content="رسالة خاصة جداً">
  <meta property="og:type" content="website">
  <meta property="og:url" id="og-url" content="">
  <meta property="og:image" id="og-image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitter-title" content="أنا آسف يا نونتي 🤍">
  <meta name="twitter:description" id="twitter-desc" content="رسالة خاصة جداً">
  <meta name="twitter:image" id="twitter-image" content="">
  <link rel="canonical" id="canonical-link" href="">
  <link rel="manifest" href="manifest.webmanifest" id="manifest-link">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤍</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤍</text></svg>">
  <style>
    :root {
      --bg-deep: #050510;
      --glass-bg: rgba(10, 10, 25, 0.35);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f0e6ff;
      --text-soft: #c8b8e8;
      --accent: #c084fc;
      --accent-glow: #a855f7;
      --gold: #fbbf24;
      --card-radius: 2.5rem;
      --transition-speed: 0.4s;
      --cursor-size: 18px;
      --cursor-glow: #a855f7;
      --glass-blur: 20px;
      --glass-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 30px rgba(192,132,252,0.15);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      font-family:'Cairo','Segoe UI',system-ui,-apple-system,sans-serif;
      background:var(--bg-deep);
      color:var(--text-primary);
      overflow-x:hidden;
      scroll-behavior:auto;
      cursor:none;
      line-height:1.8;
      -webkit-tap-highlight-color:transparent;
      -webkit-font-smoothing:antialiased;
    }
    @media (hover: none) { body { cursor: auto; } }
    body.user-is-tabbing *:focus{outline:2px solid var(--accent);outline-offset:4px}
    #cursor{
      position:fixed;width:var(--cursor-size);height:var(--cursor-size);
      border:2px solid rgba(192,132,252,0.8);border-radius:50%;pointer-events:none;
      z-index:9999;transform:translate(-50%,-50%);
      transition:transform 0.08s ease-out,width 0.2s,height 0.2s,background 0.2s,border-color 0.2s;
      backdrop-filter:blur(4px);box-shadow:0 0 calc(var(--cursor-size)*1.2) var(--cursor-glow);
      mix-blend-mode:screen;
    }
    #cursor.dot{width:8px;height:8px;background:var(--accent);border:none;box-shadow:0 0 28px var(--accent)}
    #progress-bar{
      position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));
      width:0%;z-index:1001;box-shadow:0 0 15px var(--accent);transition:width 0.1s linear;
    }
    #splash-screen{
      position:fixed;inset:0;background:#000;z-index:9998;display:flex;align-items:center;justify-content:center;
      flex-direction:column;opacity:1;transition:opacity 1.2s ease;pointer-events:all;
    }
    #splash-screen.fade-out{opacity:0;pointer-events:none}
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    main{position:relative;z-index:2}
    section{
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:3rem 1.5rem;opacity:0;transform:translateY(40px);transition:opacity 0.8s ease,transform 0.8s ease;
    }
    section.visible{opacity:1;transform:translateY(0)}
    .glass-panel{
      background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
      border:1px solid var(--glass-border);border-radius:var(--card-radius);padding:2.8rem 2rem;
      box-shadow:var(--glass-shadow);max-width:750px;width:100%;text-align:center;
      transition:transform var(--transition-speed),box-shadow var(--transition-speed);will-change:transform;
    }
    h2{
      font-size:clamp(2rem,6vw,3rem);font-weight:500;letter-spacing:2px;margin-bottom:1.8rem;
      background:linear-gradient(135deg,#e9d5ff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .typing-text{font-size:1.3rem;color:var(--text-soft);min-height:3rem;white-space:pre-wrap;word-break:break-word;line-height:2.4}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1.2rem;width:100%;margin-top:1.8rem}
    .gallery-item{
      aspect-ratio:1/1;border-radius:1.8rem;overflow:hidden;background:rgba(255,255,255,0.03);
      backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);transition:transform 0.4s,filter 0.3s;cursor:pointer;
    }
    .gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s;opacity:0;transition:opacity 0.3s;}
    .gallery-item img.loaded{opacity:1}
    .gallery-item.error{background:rgba(255,0,0,0.1);display:flex;align-items:center;justify-content:center;color:#ffaaaa;font-size:0.9rem}
    .video-grid{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center;margin-top:2rem}
    .video-card{
      width:260px;border-radius:2rem;overflow:hidden;background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.12);transition:transform 0.3s;position:relative;
    }
    .video-card video{width:100%;display:block;border-radius:1.8rem;background:#000}
    .fullscreen-btn{
      position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);
      border:none;color:white;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;font-size:1.2rem;z-index:5;
    }
    .star-field{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:2rem}
    .star-message{
      background:rgba(255,255,240,0.07);backdrop-filter:blur(10px);border-radius:3rem;padding:0.7rem 1.8rem;
      color:#f5e9ff;font-size:1rem;border:1px solid rgba(255,255,200,0.18);transition:0.25s;cursor:pointer;
      box-shadow:0 0 12px rgba(192,132,252,0.2);
    }
    .counter-digits{
      font-size:clamp(2rem,8vw,3.8rem);font-weight:500;display:flex;gap:1.5rem;justify-content:center;
      flex-wrap:wrap;background:rgba(0,0,0,0.5);backdrop-filter:blur(14px);border-radius:4rem;padding:2rem 2.5rem;margin:1.8rem 0;
    }
    .digit-block span{display:block;font-size:0.9rem;color:var(--text-soft)}
    .btn{
      background:rgba(255,255,255,0.04);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.15);
      padding:0.9rem 2.5rem;border-radius:3rem;color:white;font-size:1.2rem;transition:0.3s;
      display:inline-flex;align-items:center;gap:0.6rem;margin-top:1.8rem;cursor:pointer;
    }
    .lightbox{
      position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);z-index:9000;
      display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;
    }
    .lightbox.active{opacity:1;pointer-events:auto}
    .lightbox-content{position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-x}
    .lightbox img{max-width:85vw;max-height:85vh;border-radius:2rem;box-shadow:0 0 60px rgba(192,132,252,0.5)}
    .lightbox-nav{
      position:absolute;top:50%;transform:translateY(-50%);font-size:2.5rem;background:rgba(0,0,0,0.5);
      backdrop-filter:blur(10px);border:none;color:white;padding:0.5rem 1rem;cursor:pointer;border-radius:1rem;
    }
    .lightbox-prev{left:1rem}.lightbox-next{right:1rem}
    .lightbox-counter{
      position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);
      backdrop-filter:blur(10px);color:white;padding:0.4rem 1.5rem;border-radius:2rem;font-size:0.9rem;
    }
    .lightbox-close{
      position:absolute;top:2rem;right:2rem;background:rgba(0,0,0,0.6);border:none;color:white;font-size:2rem;
      width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
    }
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);z-index:9500;
      display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;
    }
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal-content{
      background:var(--glass-bg);backdrop-filter:blur(25px);border:1px solid var(--glass-border);
      border-radius:2rem;padding:2rem;max-width:400px;width:90%;text-align:center;
      box-shadow:0 30px 60px rgba(0,0,0,0.7);position:relative;
    }
    .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:white;font-size:1.8rem;cursor:pointer}
    .music-toggle{
      position:fixed;bottom:1.5rem;left:1.5rem;z-index:1000;background:rgba(20,20,40,0.7);backdrop-filter:blur(15px);
      border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,0.2);color:white;font-size:1.5rem;cursor:pointer;
    }
    @media(max-width:600px){.glass-panel{padding:2rem 1.2rem}.counter-digits{gap:1rem;padding:1.5rem}}
  </style>
  <link rel="preload" as="image" href="" id="preload-image" fetchpriority="high">
  <link rel="preload" as="audio" href="" id="preload-audio">
  <link rel="preload" as="video" href="" id="preload-video">
</head>
<body>
  <div id="cursor"></div>
  <div id="progress-bar"></div>
  <div id="splash-screen"></div>
  <canvas id="bg-canvas"></canvas>
  <button class="music-toggle" id="music-toggle" aria-label="تحكم بالموسيقى">🎵</button>
  <main id="main-content"></main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <div class="lightbox-content">
      <img src="" alt="">
      <button class="lightbox-nav lightbox-prev">‹</button>
      <button class="lightbox-nav lightbox-next">›</button>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
  </div>

  <div class="modal-overlay" id="star-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div id="modal-text" style="font-size:1.3rem;color:var(--text-soft);"></div>
    </div>
  </div>

  <script>
    (function() {
      const isMobile = /Mobi|Android/i.test(navigator.userAgent);
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let performanceMode = 'auto';
      let fpsInterval = 1000 / 30;
      let lastFrameTime = 0;

      const cursor = document.getElementById('cursor');
      const progressBar = document.getElementById('progress-bar');
      const splashScreen = document.getElementById('splash-screen');
      const mainContainer = document.getElementById('main-content');
      const bgCanvas = document.getElementById('bg-canvas');
      const musicToggle = document.getElementById('music-toggle');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = lightbox.querySelector('img');
      const lightboxClose = document.getElementById('lightbox-close');
      const lightboxPrev = lightbox.querySelector('.lightbox-prev');
      const lightboxNext = lightbox.querySelector('.lightbox-next');
      const lightboxCounter = document.getElementById('lightbox-counter');
      const starModal = document.getElementById('star-modal');
      const modalClose = document.getElementById('modal-close');
      const modalText = document.getElementById('modal-text');

      let appData = {};
      let bgMusic = null;
      let lenisInstance = null;
      let lenisAnimationId = null;
      let threeJsData = null;
      let activeTimers = [];
      let activeObservers = [];
      let lightboxImages = [];
      let currentLightboxIndex = 0;
      const imageCache = new Map();
      let typingQueue = Promise.resolve();
      const galleryClickHandlers = new Map();
      const visualizerAnimationIds = new Map();
      let manifestBlobUrlGlobal = null;

      function loadScript(src, id) {
        return new Promise(resolve => {
          if (document.getElementById(id)) return resolve(true);
          const script = document.createElement('script');
          script.src = src;
          script.id = id;
          script.onload = () => resolve(true);
          script.onerror = () => resolve(false);
          document.head.appendChild(script);
        });
      }

      async function loadDependencies() {
        const [three, lenisOk, confettiOk] = await Promise.all([
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'threejs'),
          loadScript('https://unpkg.com/@studio-freight/lenis@1.0.19/dist/lenis.min.js', 'lenis'),
          loadScript('https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js', 'confetti')
        ]);
        return { three, lenis: lenisOk, confetti: confettiOk };
      }

      const JSON_FILES = [
        'site.json', 'settings.json', 'intro.json', 'timeline.json',
        'gallery.json', 'videos.json', 'voice.json', 'letters.json',
        'counter.json', 'ending.json', 'effects.json'
      ];

      const defaultData = {
        site: { title: 'أنا آسف يا نونتي 🤍', lang: 'ar', dir: 'rtl', primaryColor: '#c084fc', secondaryColor: '#a855f7', description: 'رسالة اعتذار من القلب' },
        settings: { enableMusic: true, enableParallax: true, enableTilt: true, enableFog: true, performanceMode: 'auto', glassOpacity: 0.35, borderRadius: '2.5rem', transitionSpeed: '0.4s' },
        intro: { title: 'نونتي 🤍', subtitle: '', message: 'عارف إن مجرد كلمة آسف يمكن متكفيش\nلكن دي أول كلمة طلعت من قلبي', backgroundMusic: '', starCount: 400, firstImage: '', firstVideo: '' },
        timeline: [],
        gallery: [],
        videos: [],
        voice: { audio: '', title: 'اسمعيني' },
        letters: [],
        counter: { startDate: '2025-01-01T00:00:00', labels: { days: 'يوم', hours: 'ساعة', minutes: 'دقيقة', seconds: 'ثانية' } },
        ending: { image: '', message: 'بحبك يا نونتي\nوأسف بجد', confetti: true },
        effects: { auroraSpeed: 0.5, particlesCount: 400, fogOpacity: 0.06, starSize: 0.04, starColor: '#ffffff', nebulaColor1: '#7c3aed', nebulaColor2: '#a21caf', backgroundGradient: 'linear-gradient(180deg, #050510 0%, #0a0a1a 100%)', cursorGlow: '#a855f7', cursorSize: 18, glassBlur: 20, glassShadow: '0 25px 50px rgba(0,0,0,0.6), 0 0 30px rgba(192,132,252,0.15)' }
      };

      async function fetchJSON(filename) {
        try {
          const res = await fetch(filename);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (err) {
          console.warn(`⚠️ تعذر تحميل ${filename}:`, err.message);
          return null;
        }
      }

      async function loadAllData() {
        const results = await Promise.all(JSON_FILES.map(fetchJSON));
        const keys = JSON_FILES.map(f => f.replace('.json', ''));
        keys.forEach((key, i) => {
          appData[key] = results[i] || defaultData[key] || {};
        });
      }

      function applyAllSettings() {
        const s = appData.settings || {};
        const e = appData.effects || {};
        const root = document.documentElement.style;
        if (s.primaryColor) root.setProperty('--accent', s.primaryColor);
        if (s.secondaryColor) root.setProperty('--accent-glow', s.secondaryColor);
        if (s.glassOpacity) root.setProperty('--glass-bg', `rgba(10,10,25,${s.glassOpacity})`);
        if (s.borderRadius) root.setProperty('--card-radius', s.borderRadius);
        if (s.transitionSpeed) root.setProperty('--transition-speed', s.transitionSpeed);
        if (e.cursorGlow) root.setProperty('--cursor-glow', e.cursorGlow);
        if (e.cursorSize) root.setProperty('--cursor-size', `${e.cursorSize}px`);
        if (e.glassBlur) root.setProperty('--glass-blur', `${e.glassBlur}px`);
        if (e.glassShadow) root.setProperty('--glass-shadow', e.glassShadow);
        if (e.backgroundGradient) document.body.style.background = e.backgroundGradient;
        performanceMode = s.performanceMode || 'auto';
        if (performanceMode === 'auto' && (prefersReducedMotion || isMobile)) {
          appData.settings.enableFog = false;
          appData.settings.enableParallax = false;
        }
        if (isMobile) {
          fpsInterval = 1000 / 20;
          if (cursor) cursor.remove();
        }
      }

      function updateMetaTags() {
        const site = appData.site || {};
        document.title = site.title || 'أنا آسف يا نونتي 🤍';
        document.getElementById('page-title').textContent = site.title;
        document.getElementById('meta-desc').content = site.description || '';
        document.getElementById('og-title').content = site.title;
        document.getElementById('og-desc').content = site.description;
        document.getElementById('og-url').content = window.location.href;
        document.getElementById('og-image').content = site.image || '';
        document.getElementById('twitter-title').content = site.title;
        document.getElementById('twitter-desc').content = site.description;
        document.getElementById('twitter-image').content = site.image || '';
        document.getElementById('canonical-link').href = window.location.href;
      }

      function setupCursor() {
        if (isMobile) return;
        document.addEventListener('mousemove', e => {
          cursor.style.left = e.clientX + 'px';
          cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
        document.addEventListener('mouseenter', () => cursor.style.opacity = '1');
        document.addEventListener('mousedown', () => cursor.classList.add('dot'));
        document.addEventListener('mouseup', () => cursor.classList.remove('dot'));
      }

      function setupProgressBar() {
        window.addEventListener('scroll', () => {
          const scrollTop = window.scrollY;
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          progressBar.style.width = (scrollTop / docHeight) * 100 + '%';
        });
      }

      function setupMusic() {
        const intro = appData.intro || {};
        if (intro.backgroundMusic && appData.settings.enableMusic) {
          bgMusic = new Audio(intro.backgroundMusic);
          bgMusic.loop = true;
          bgMusic.volume = 0.2;
          document.addEventListener('click', function start() { bgMusic.play().catch(()=>{}); }, { once: true });
        }
        musicToggle.addEventListener('click', () => {
          if (!bgMusic) return;
          if (bgMusic.paused) { bgMusic.play(); musicToggle.textContent = '🔊'; }
          else { bgMusic.pause(); musicToggle.textContent = '🔇'; }
        });
      }

      function buildSplash() {
        const intro = appData.intro || {};
        splashScreen.innerHTML = `
          <div style="text-align:center;color:white;">
            <h1 style="font-size:4rem;background:linear-gradient(135deg,#e9d5ff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${intro.title || ''}</h1>
            <p style="margin-top:1rem;color:#c8b8e8;">${intro.subtitle || ''}</p>
          </div>
        `;
        setTimeout(() => {
          splashScreen.classList.add('fade-out');
          setTimeout(() => splashScreen.remove(), 1200);
        }, 2000);
      }

      function buildSections() {
        const timeline = Array.isArray(appData.timeline) ? appData.timeline : [];
        const galleryData = Array.isArray(appData.gallery) ? appData.gallery : [];
        const videosData = Array.isArray(appData.videos) ? appData.videos : [];
        const voice = appData.voice || {};
        const counter = appData.counter || {};
        const ending = appData.ending || {};
        const letters = Array.isArray(appData.letters) ? appData.letters : [];

        function createSection(item, index) {
          const sec = document.createElement('section');
          sec.id = item.id || `section-${index}`;
          sec.dataset.type = item.type;
          let html = `<div class="glass-panel"><h2>${item.title || ''}</h2>`;
          switch (item.type) {
            case 'message':
              const letter = letters.find(l => l.id === item.letterId);
              const text = letter ? letter.content : (item.text || '');
              html += `<div class="typing-text" data-text="${escapeHtml(text)}"></div>`;
              break;
            case 'gallery':
              const images = item.images || galleryData.map(g => g.src);
              html += `<div class="gallery-grid" id="gallery-${sec.id}"></div>`;
              sec.dataset.images = JSON.stringify(images);
              break;
            case 'videos':
              const vids = item.videos || videosData.map(v => v.src);
              html += `<div class="video-grid" id="videos-${sec.id}"></div>`;
              sec.dataset.videos = JSON.stringify(vids);
              break;
            case 'voice':
              html += `<button class="btn" id="play-voice-${sec.id}">🔊 ${voice.title || 'تشغيل'}</button>
                       <audio id="audio-${sec.id}" src="${voice.audio || ''}" preload="none"></audio>
                       <canvas id="visualizer-${sec.id}" width="300" height="60" style="width:100%;margin-top:1rem;border-radius:2rem;"></canvas>`;
              break;
            case 'stars':
              const starMsgs = item.stars || [];
              html += `<div class="star-field">${starMsgs.map(msg => `<span class="star-message" role="button" tabindex="0">🤍 ${escapeHtml(msg)}</span>`).join('')}</div>`;
              break;
            case 'counter':
              html += `<div class="counter-digits" id="counter-${sec.id}"></div>`;
              break;
            case 'dreams':
              const dreamList = item.dreams || [];
              html += `<div class="star-field">${dreamList.map(d => `<span class="star-message">💭 ${escapeHtml(d)}</span>`).join('')}</div>`;
              break;
            case 'ending':
              html += `<div id="ending-img-${sec.id}"></div><div class="typing-text" data-text="${escapeHtml(item.text || ending.message || '')}"></div>`;
              break;
          }
          html += `</div>`;
          sec.innerHTML = html;
          mainContainer.appendChild(sec);
          initSectionInteractions(sec, item);
          return sec;
        }

        timeline.forEach((item, i) => createSection(item, i));
      }

      function escapeHtml(text) {
        return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function loadGalleryImages(container, images) {
        if (galleryClickHandlers.has(container)) {
          container.removeEventListener('click', galleryClickHandlers.get(container));
        }
        const clickHandler = (e) => {
          const img = e.target.closest('img');
          if (!img || !img.src) return;
          const allImgs = Array.from(container.querySelectorAll('img')).map(i => i.src);
          openLightbox(allImgs, Array.from(container.querySelectorAll('img')).indexOf(img));
        };
        container.addEventListener('click', clickHandler);
        galleryClickHandlers.set(container, clickHandler);

        images.forEach((src, index) => {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          const img = document.createElement('img');
          img.alt = 'صورة';
          img.decoding = 'async';
          img.loading = 'lazy';
          if (index === 0) {
            img.fetchPriority = 'high';
            img.loading = 'eager';
          }
          div.appendChild(img);
          container.appendChild(div);

          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const targetImg = entry.target;
                if (imageCache.has(src)) {
                  targetImg.src = imageCache.get(src).src;
                  targetImg.classList.add('loaded');
                } else {
                  targetImg.onload = () => {
                    targetImg.classList.add('loaded');
                    const cachedImg = new Image();
                    cachedImg.src = src;
                    imageCache.set(src, cachedImg);
                  };
                  targetImg.onerror = () => {
                    div.classList.add('error');
                    div.innerHTML = '<span>🖼️</span><br><small>خطأ</small>';
                  };
                  targetImg.src = src;
                }
                observer.unobserve(targetImg);
              }
            });
          }, { rootMargin: '200px' });
          observer.observe(img);
          activeObservers.push(observer);
        });
      }

      function loadVideos(container, videos) {
        videos.forEach(src => {
          const card = document.createElement('div');
          card.className = 'video-card';
          const video = document.createElement('video');
          video.playsInline = true;
          video.controls = true;
          video.preload = 'none';
          video.loading = 'lazy';
          const btn = document.createElement('button');
          btn.className = 'fullscreen-btn';
          btn.textContent = '⛶';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
              if (video.requestFullscreen) video.requestFullscreen();
              else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            } else {
              if (document.exitFullscreen) document.exitFullscreen();
            }
          });
          card.appendChild(video);
          card.appendChild(btn);
          container.appendChild(card);

          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                video.src = src;
                video.load();
                observer.unobserve(video);
              }
            });
          }, { rootMargin: '200px' });
          observer.observe(video);
          activeObservers.push(observer);
        });
      }

      async function typeInElement(el, text, min = 35, max = 75) {
        el.textContent = '';
        for (let char of text) {
          el.textContent += char;
          await new Promise(r => setTimeout(r, min + Math.random() * (max - min)));
        }
      }

      function enqueueTyping(el, text) {
        typingQueue = typingQueue.then(() => typeInElement(el, text));
      }

      function initSectionInteractions(sec, item) {
        if (item.type === 'gallery' && sec.dataset.images) {
          const images = JSON.parse(sec.dataset.images);
          const grid = sec.querySelector('.gallery-grid');
          if (grid) loadGalleryImages(grid, images);
        }

        if (item.type === 'videos' && sec.dataset.videos) {
          const videos = JSON.parse(sec.dataset.videos);
          const grid = sec.querySelector('.video-grid');
          if (grid) loadVideos(grid, videos);
        }

        const typingEl = sec.querySelector('.typing-text');
        if (typingEl && typingEl.dataset.text) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                enqueueTyping(typingEl, typingEl.dataset.text);
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.5 });
          observer.observe(sec);
          activeObservers.push(observer);
        }

        if (item.type === 'voice') {
          const audio = sec.querySelector('audio');
          const btn = sec.querySelector('button');
          const canvas = sec.querySelector('canvas');
          if (audio && btn && canvas) {
            let audioCtx, analyser, source;
            btn.addEventListener('click', async () => {
              if (audio.paused) {
                if (bgMusic) bgMusic.pause();
                await audio.play();
                btn.textContent = '⏸️ إيقاف';
                if (!audioCtx) {
                  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  analyser = audioCtx.createAnalyser();
                  source = audioCtx.createMediaElementSource(audio);
                  source.connect(analyser);
                  analyser.connect(audioCtx.destination);
                  visualizeAudio(analyser, canvas, sec.id);
                }
                audio.onended = () => {
                  btn.textContent = '🔊 تشغيل';
                  if (bgMusic) bgMusic.play().catch(()=>{});
                  if (audioCtx) {
                    if (source) source.disconnect();
                    if (analyser) analyser.disconnect();
                    audioCtx.close().catch(() => {});
                    audioCtx = null;
                    if (visualizerAnimationIds.has(sec.id)) {
                      cancelAnimationFrame(visualizerAnimationIds.get(sec.id));
                      visualizerAnimationIds.delete(sec.id);
                    }
                  }
                };
              } else {
                audio.pause();
                btn.textContent = '🔊 تشغيل';
                if (bgMusic) bgMusic.play().catch(()=>{});
                if (audioCtx) {
                  if (source) source.disconnect();
                  if (analyser) analyser.disconnect();
                  audioCtx.close().catch(() => {});
                  audioCtx = null;
                  if (visualizerAnimationIds.has(sec.id)) {
                    cancelAnimationFrame(visualizerAnimationIds.get(sec.id));
                    visualizerAnimationIds.delete(sec.id);
                  }
                }
              }
            });
            sec.audioCtx = () => audioCtx;
            sec.audioElement = audio;
            sec.audioSource = () => source;
            sec.audioAnalyser = () => analyser;
          }
        }

        if (item.type === 'counter') {
          const counterEl = document.getElementById(`counter-${sec.id}`);
          const startDate = new Date(appData.counter?.startDate || '2025-01-01T00:00:00');
          const update = () => {
            const now = new Date();
            let diff = Math.floor((now - startDate) / 1000);
            if (diff < 0) diff = 0;
            const d = Math.floor(diff / 86400), h = Math.floor((diff % 86400) / 3600), m = Math.floor((diff % 3600) / 60), s = diff % 60;
            counterEl.innerHTML = `<div class="digit-block">${d}<span>يوم</span></div><div class="digit-block">${h}<span>ساعة</span></div><div class="digit-block">${m}<span>دقيقة</span></div><div class="digit-block">${s}<span>ثانية</span></div>`;
          };
          update();
          const timer = setInterval(update, 1000);
          activeTimers.push(timer);
        }

        if (item.type === 'ending') {
          const imgContainer = document.getElementById(`ending-img-${sec.id}`);
          const endingImg = appData.ending?.image || item.image;
          if (endingImg && imgContainer) {
            const img = document.createElement('img');
            img.src = endingImg;
            img.style.maxWidth = '220px';
            img.style.borderRadius = '2rem';
            imgContainer.appendChild(img);
          }
          if (appData.ending?.confetti !== false && window.confetti) {
            setTimeout(() => confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } }), 2000);
          }
        }

        sec.querySelectorAll('.star-message').forEach(star => {
          star.addEventListener('click', () => {
            modalText.textContent = star.textContent.replace(/^[🤍💭]\s*/, '');
            starModal.classList.add('active');
          });
        });
      }

      function visualizeAudio(analyser, canvas, sectionId) {
        if (visualizerAnimationIds.has(sectionId)) {
          cancelAnimationFrame(visualizerAnimationIds.get(sectionId));
        }
        const ctx = canvas.getContext('2d');
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        let animationId;
        const draw = () => {
          animationId = requestAnimationFrame(draw);
          visualizerAnimationIds.set(sectionId, animationId);
          analyser.getByteTimeDomainData(dataArray);
          ctx.fillStyle = 'rgba(10,10,25,0.4)';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.lineWidth=2; ctx.strokeStyle='#c084fc'; ctx.beginPath();
          const sliceWidth = canvas.width/bufferLength;
          let x=0;
          for(let i=0;i<bufferLength;i++){
            const v = dataArray[i]/128.0;
            const y = v*canvas.height/2;
            i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            x+=sliceWidth;
          }
          ctx.stroke();
        };
        draw();
      }

      function openLightbox(imagesArray, startIndex = 0) {
        lightboxImages = imagesArray;
        currentLightboxIndex = startIndex;
        updateLightboxImage();
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
      function updateLightboxImage() {
        if (lightboxImages.length === 0) return;
        lightboxImg.src = lightboxImages[currentLightboxIndex];
        lightboxCounter.textContent = `${currentLightboxIndex + 1} / ${lightboxImages.length}`;
      }
      function lightboxNextImage() { if(lightboxImages.length) { currentLightboxIndex = (currentLightboxIndex + 1) % lightboxImages.length; updateLightboxImage(); } }
      function lightboxPrevImage() { if(lightboxImages.length) { currentLightboxIndex = (currentLightboxIndex - 1 + lightboxImages.length) % lightboxImages.length; updateLightboxImage(); } }
      function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
      function setupLightbox() {
        lightboxClose.addEventListener('click', closeLightbox);
        lightboxNext.addEventListener('click', lightboxNextImage);
        lightboxPrev.addEventListener('click', lightboxPrevImage);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => {
          if (!lightbox.classList.contains('active')) return;
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowRight') lightboxNextImage();
          if (e.key === 'ArrowLeft') lightboxPrevImage();
        });
        let touchStartX = 0;
        lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
        lightbox.addEventListener('touchend', e => {
          const diff = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(diff) > 50) diff > 0 ? lightboxPrevImage() : lightboxNextImage();
        });
      }

      function setupModal() {
        modalClose.addEventListener('click', () => starModal.classList.remove('active'));
        starModal.addEventListener('click', (e) => { if (e.target === starModal) starModal.classList.remove('active'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && starModal.classList.contains('active')) starModal.classList.remove('active'); });
      }

      function initThreeJS() {
        if (!window.THREE) return;
        const effects = appData.effects || {};
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas, alpha: true, antialias: !isMobile });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        const starCount = effects.particlesCount || 400;
        const starsGeo = new THREE.BufferGeometry();
        const pos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          pos[i] = (Math.random() - 0.5) * 20;
          pos[i+1] = (Math.random() - 0.5) * 12;
          pos[i+2] = (Math.random() - 0.5) * 8 - 2;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const starsMat = new THREE.PointsMaterial({ color: effects.starColor || '#fff', size: effects.starSize || 0.04, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        let fogMesh, fogGeo, fogMat;
        if (appData.settings.enableFog !== false) {
          fogGeo = new THREE.PlaneGeometry(16, 10);
          fogMat = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 }, color1: { value: new THREE.Color(effects.nebulaColor1 || '#7c3aed') }, color2: { value: new THREE.Color(effects.nebulaColor2 || '#a21caf') }, opacity: { value: effects.fogOpacity || 0.06 } },
            vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `varying vec2 vUv; uniform float time; uniform vec3 color1,color2; uniform float opacity; void main(){ float m=sin(vUv.x*5.0+time)*0.5+0.5; gl_FragColor=vec4(mix(color1,color2,m),opacity); }`
          });
          fogMesh = new THREE.Mesh(fogGeo, fogMat);
          fogMesh.position.z = -3;
          scene.add(fogMesh);
        }

        const resizeHandler = () => {
          camera.aspect = innerWidth/innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        };
        window.addEventListener('resize', resizeHandler);

        let animationId;
        const animate = (timestamp) => {
          if (!threeJsData) return;
          animationId = requestAnimationFrame(animate);
          threeJsData.animationId = animationId;
          if (timestamp - lastFrameTime < fpsInterval) return;
          lastFrameTime = timestamp;
          stars.rotation.y += 0.0001;
          if (fogMat) fogMat.uniforms.time.value += effects.auroraSpeed || 0.005;
          renderer.render(scene, camera);
        };
        animationId = requestAnimationFrame(animate);
        threeJsData = { scene, camera, renderer, starsGeo, starsMat, fogGeo, fogMat, fogMesh, resizeHandler, animationId };
      }

      function initLenis() {
        if (window.Lenis && !prefersReducedMotion) {
          lenisInstance = new Lenis({ duration: 1.2, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
          const raf = (time) => { lenisInstance.raf(time); lenisAnimationId = requestAnimationFrame(raf); };
          lenisAnimationId = requestAnimationFrame(raf);
        } else {
          document.documentElement.style.scrollBehavior = 'smooth';
        }
      }

      async function setupPWA() {
        try {
          const res = await fetch('manifest.webmanifest');
          if (res.ok) {
            document.getElementById('manifest-link').href = 'manifest.webmanifest';
          } else {
            const manifest = {
              name: appData.site?.title || 'أنا آسف يا نونتي 🤍',
              short_name: 'نونتي',
              start_url: '.',
              display: 'standalone',
              background_color: '#050510',
              theme_color: '#0a0a1a',
              icons: [{ src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🤍</text></svg>', sizes: '100x100', type: 'image/svg+xml' }]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            manifestBlobUrlGlobal = URL.createObjectURL(blob);
            document.getElementById('manifest-link').href = manifestBlobUrlGlobal;
          }
        } catch(e) {}
        if ('serviceWorker' in navigator) {
          try { await navigator.serviceWorker.register('sw.js'); console.log('Service Worker registered'); } catch(e) { console.warn('Service Worker غير متاح'); }
        }
        if (manifestBlobUrlGlobal) {
          setTimeout(() => { if (manifestBlobUrlGlobal) { URL.revokeObjectURL(manifestBlobUrlGlobal); manifestBlobUrlGlobal = null; } }, 5000);
        }
      }

      function setupPreload() {
        const intro = appData.intro || {};
        if (intro.firstImage) document.getElementById('preload-image').href = intro.firstImage;
        if (intro.backgroundMusic) document.getElementById('preload-audio').href = intro.backgroundMusic;
        if (intro.firstVideo) document.getElementById('preload-video').href = intro.firstVideo;
      }

      function setupAccessibility() {
        document.querySelectorAll('section').forEach(sec => {
          const h2 = sec.querySelector('h2');
          if (h2) sec.setAttribute('aria-label', h2.textContent);
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Tab') document.body.classList.add('user-is-tabbing'); });
        document.addEventListener('mousedown', () => document.body.classList.remove('user-is-tabbing'));
      }

      function cleanup() {
        activeTimers.forEach(clearInterval);
        activeObservers.forEach(o => o.disconnect());
        if (lenisAnimationId) cancelAnimationFrame(lenisAnimationId);
        if (lenisInstance) lenisInstance.destroy();
        visualizerAnimationIds.forEach(id => cancelAnimationFrame(id));
        visualizerAnimationIds.clear();
        if (threeJsData) {
          cancelAnimationFrame(threeJsData.animationId);
          threeJsData.starsGeo.dispose();
          threeJsData.starsMat.dispose();
          if (threeJsData.fogGeo) threeJsData.fogGeo.dispose();
          if (threeJsData.fogMat) threeJsData.fogMat.dispose();
          if (threeJsData.fogMesh) threeJsData.scene.remove(threeJsData.fogMesh);
          threeJsData.renderer.dispose();
          window.removeEventListener('resize', threeJsData.resizeHandler);
          threeJsData = null;
        }
        document.querySelectorAll('section').forEach(sec => {
          if (sec.audioCtx && sec.audioCtx()) {
            const ctx = sec.audioCtx();
            const source = sec.audioSource ? sec.audioSource() : null;
            const analyser = sec.audioAnalyser ? sec.audioAnalyser() : null;
            if (source) source.disconnect();
            if (analyser) analyser.disconnect();
            ctx.close().catch(() => {});
          }
          if (sec.audioElement) { sec.audioElement.pause(); sec.audioElement.src = ''; }
        });
        galleryClickHandlers.forEach((handler, container) => { container.removeEventListener('click', handler); });
        galleryClickHandlers.clear();
        if (manifestBlobUrlGlobal) { URL.revokeObjectURL(manifestBlobUrlGlobal); manifestBlobUrlGlobal = null; }
      }

      async function startApp() {
        try {
          const libs = await loadDependencies();
          await loadAllData();
          applyAllSettings();
          updateMetaTags();
          setupPreload();
          setupCursor();
          setupProgressBar();
          setupMusic();
          buildSplash();
          buildSections();
          if (libs.three) initThreeJS();
          initLenis();
          setupLightbox();
          setupModal();
          setupAccessibility();
          await setupPWA();

          const visibilityObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                entry.target.querySelectorAll('video').forEach(v => { if (v.src) v.play().catch(()=>{}); });
              } else {
                entry.target.querySelectorAll('video').forEach(v => v.pause());
              }
            });
          }, { threshold: 0.3 });
          document.querySelectorAll('section').forEach(s => visibilityObserver.observe(s));
          activeObservers.push(visibilityObserver);

          mainContainer.style.visibility = 'visible';
          window.addEventListener('beforeunload', cleanup);
        } catch (err) {
          console.error(err);
          mainContainer.innerHTML = '<p style="color:white;text-align:center;padding-top:40vh;">⚠️ حدث خطأ، يرجى تحديث الصفحة</p>';
        }
      }

      startApp();
    })();
  </script>
